<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CODE:Block 관리자</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <!-- 로그인 / 방 만들기 -->
  <section id="s-login" class="login">
    <div class="cb-card">
      <h1 class="cb-title">CODE:Block</h1>
      <p class="cb-sub">관리자 화면</p>
      <div id="login-form">
        <label class="cb-label" for="password">관리자 비밀번호</label>
        <input id="password" class="cb-input text" type="password" autocomplete="current-password">
      </div>
      <div id="room-actions" class="hidden">
        <p class="center muted" id="login-ok">로그인했어요. 방을 만들어 주세요.</p>
      </div>
    </div>
    <button class="cb-btn" id="btn-login">로그인</button>
    <button class="cb-btn hidden" id="btn-create">방 만들기</button>
    <button class="btn resume hidden" id="btn-resume"></button>
  </section>

  <!-- 관리 화면 -->
  <section id="s-admin" class="admin hidden">
    <header class="topbar">
      <div class="logo">CODE:Block <span>관리자</span></div>
      <div class="pill code-pill">입장 코드 <b id="top-code"></b></div>
      <div class="pill" id="top-status"></div>
      <div class="grow"></div>
      <button class="btn" id="btn-photo" disabled>🖼 사진 크게 보기</button>
      <button class="btn" id="btn-qr">📱 QR 크게 보기</button>
      <button class="btn danger" id="btn-close">방 닫기</button>
    </header>

    <!-- 대기실 -->
    <div id="v-lobby" class="lobby">
      <aside class="col-left">
        <div class="card qr-card">
          <div class="qr" id="qr"></div>
          <div class="qr-code" id="qr-code"></div>
          <div class="muted small url" id="qr-url"></div>
          <button class="btn small" id="btn-copy">링크 복사</button>
        </div>

        <div class="card settings">
          <h3>퍼즐 설정</h3>
          <div class="field">
            <span>퍼즐 크기</span>
            <div class="size">
              <select id="cols"></select><b>×</b><select id="rows"></select>
              <span class="muted small">가로 × 세로</span>
            </div>
          </div>
          <div class="field">
            <span>조각 모양</span>
            <div class="seg" id="shape">
              <button data-v="square">네모</button><button data-v="triangle">세모</button><button data-v="mixed">섞어서</button>
            </div>
          </div>
          <div class="field">
            <span>그룹 수</span>
            <div class="stepper"><button id="g-minus">−</button><b id="g-count"></b><button id="g-plus">+</button></div>
          </div>
          <div class="field">
            <span>친구 조각 투명도</span>
            <div class="opacity"><input type="range" id="opacity" min="10" max="100" step="5"><b id="opacity-val"></b></div>
          </div>
          <div class="field col">
            <span>퍼즐 사진</span>
            <div class="photo">
              <div class="preview" id="preview"><span>사진 없음</span></div>
              <div class="photo-pick">
                <label class="btn upload">📷 사진 첨부<input type="file" id="upload" accept="image/*" hidden></label>
                <div class="presets" id="presets"></div>
              </div>
            </div>
            <div class="library-head"><span>올린 사진</span><span class="muted small">이 방에 임시로 보관돼요 (최대 12장)</span></div>
            <div class="library" id="library"><span class="muted small">아직 올린 사진이 없어요</span></div>
          </div>
          <div class="info" id="piece-info"></div>
        </div>
        <button class="cb-btn" id="btn-start">게임 시작</button>
      </aside>

      <main class="col-main">
        <div class="section-head">
          <h2>참가자 <span class="muted" id="player-total"></span></h2>
          <span class="muted small">플레이어가 고른 그룹이 바로 표시돼요. 옮기거나 내보낼 수 있어요.</span>
        </div>
        <div class="unassigned card" id="unassigned-card">
          <b>아직 그룹을 고르지 않은 친구</b>
          <div class="chips" id="unassigned"></div>
        </div>
        <div class="group-board" id="group-board"></div>
      </main>
    </div>

    <!-- 게임 중 -->
    <div id="v-game" class="gameview hidden">
      <div class="controls">
        <span class="pill big">⏱ <b id="timer">0:00</b></span>
        <button class="hint-btn" id="btn-hint">💡 전체 힌트 보여주기</button>
        <div class="grow"></div>
        <label class="pill opacity-pill">친구 조각 투명도 <input type="range" id="opacity2" min="10" max="100" step="5"><b id="opacity2-val"></b></label>
        <label class="pill sound"><input type="checkbox" id="sound-on" checked> 🔔 소리</label>
        <button class="btn dark" id="btn-reset">다음 판 준비</button>
      </div>
      <div class="ranking hidden" id="ranking"></div>
      <div class="game-groups" id="game-groups"></div>
    </div>
  </section>

  <!-- 큰 QR -->
  <div class="overlay hidden" id="qr-overlay">
    <div class="cb-card center qr-big-card">
      <h1 class="cb-title sm">📱 QR을 찍고 들어와요</h1>
      <div class="qr big" id="qr-big"></div>
      <div class="big-code" id="qr-big-code"></div>
      <button class="btn" id="btn-qr-close">닫기</button>
    </div>
  </div>

  <!-- 퍼즐 사진 크게 보기 -->
  <div class="overlay photo-overlay hidden" id="photo-overlay">
    <div class="photo-big-wrap">
      <div class="photo-big" id="photo-big"></div>
      <button class="btn" id="btn-photo-close">닫기</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="core.js"></script>
  <script src="presets.js"></script>
  <script src="admin.js"></script>
</body>
</html>
