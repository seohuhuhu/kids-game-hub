<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>놀이터 - 친구랑 같이 하는 게임</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/common.css">
  <style>
    .wrap { max-width: 900px; margin: 0 auto; padding: 40px 16px 60px; }
    h1 { font-size: 48px; margin: 0 0 6px; text-align: center; }
    h1 span { color: var(--primary); }
    .sub { text-align: center; color: var(--muted); font-size: 20px; margin: 0 0 36px; }
    .games { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 22px; }
    .game { text-decoration: none; display: flex; flex-direction: column; gap: 12px; transition: transform .15s; }
    .game:hover { transform: translateY(-4px) rotate(-.5deg); }
    .thumb { height: 170px; border-radius: 16px; display: grid; place-items: center; font-size: 80px; }
    .game h2 { margin: 0; font-size: 28px; }
    .game p { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.4; }
    .tag { align-self: flex-start; font-size: 15px; padding: 4px 10px; border-radius: 99px; background: #E8F7EA; color: #3E8E4A; }
    .actions { display: flex; gap: 8px; margin-top: 4px; }
    .actions .btn { text-decoration: none; }
    .soon { opacity: .6; pointer-events: none; }
    .soon .tag { background: #F2F2F5; color: var(--muted); }
    .join { margin-top: 36px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
    .join input { max-width: 200px; text-align: center; letter-spacing: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🎈 <span>놀이터</span></h1>
    <p class="sub">친구들과 코드 하나로 모여서 같이 놀아요!</p>

    <div class="games">
      <div class="card game">
        <div class="thumb" style="background: linear-gradient(135deg,#22D3EE,#6EE75A)">🧩📖</div>
        <span class="tag">플레이 가능</span>
        <h2>CODE:Block 놀이터</h2>
        <p>한 번 들어오면 🧩 퍼즐과 📖 말씀 블록을 방을 나가지 않고 차례로 함께해요. 그룹 친구들과 이야기하며 맞춰요!</p>
        <div class="actions"><a class="btn small" href="/play/">플레이어 입장</a><a class="btn small ghost" href="/play/admin.html">관리자</a></div>
      </div>
    </div>

    <div class="join">
      <span style="font-size:20px">입장 코드가 있나요?</span>
      <input id="code" type="text" inputmode="numeric" maxlength="4" placeholder="0000">
      <button class="btn blue" id="go">들어가기</button>
    </div>
  </div>
  <script>
    const input = document.getElementById('code');
    const go = () => { const c = input.value.trim(); if (c) location.href = '/play/?code=' + encodeURIComponent(c); };
    document.getElementById('go').onclick = go;
    input.addEventListener('keydown', e => e.key === 'Enter' && go());
  </script>
</body>
</html>
